
services:
  postgres:
    image: postgres:16-alpine
    container_name: support-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportai
      POSTGRES_PASSWORD: supportai_dev_password
      POSTGRES_DB: supportai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportai -d supportai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
